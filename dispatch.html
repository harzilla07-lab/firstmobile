<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Board – FreightFlow TMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button id="hamburger" class="hamburger">&#9776;</button>
        <h1>Dispatch Board</h1>
      </div>
      <div class="topbar-actions">
        <a href="loads.html" class="btn btn-secondary">+ New Load</a>
      </div>
    </div>

    <div class="content">
      <div class="dispatch-columns" id="dispatch-board"></div>
    </div>
  </main>

  <!-- Dispatch Modal -->
  <div id="dispatch-modal" class="modal-overlay">
    <div class="modal" style="max-width:500px">
      <div class="modal-header">
        <h3 id="dispatch-modal-title">Assign Carrier</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="dispatch-load-info" style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:20px;font-size:0.875rem"></div>
        <form id="dispatch-form">
          <input type="hidden" name="loadId">
          <div class="form-grid">
            <div class="form-group full">
              <label>Carrier</label>
              <select name="carrierId" id="dispatch-carrier-select">
                <option value="">— Unassigned —</option>
              </select>
            </div>
            <div class="form-group full">
              <label>Driver</label>
              <select name="driverId" id="dispatch-driver-select">
                <option value="">— No Driver —</option>
              </select>
            </div>
            <div class="form-group full">
              <label>Status</label>
              <select name="status" id="dispatch-status-select">
                <option value="pending">Pending</option>
                <option value="dispatched">Dispatched</option>
                <option value="in-transit">In Transit</option>
                <option value="delivered">Delivered</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-dismiss>Cancel</button>
        <button class="btn btn-primary" id="btn-save-dispatch">Save Assignment</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/dispatch.js"></script>
</body>
</html>
