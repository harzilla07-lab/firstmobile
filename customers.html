<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers – FreightFlow TMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button id="hamburger" class="hamburger">&#9776;</button>
        <h1>Customers</h1>
      </div>
      <div class="topbar-actions">
        <button id="btn-new-customer" class="btn btn-primary">+ New Customer</button>
      </div>
    </div>

    <div class="content">
      <div class="filter-bar">
        <input id="customer-search" class="search-box" type="search" placeholder="Search customers, contacts…">
        <select id="customer-type-filter" class="filter-select">
          <option value="">All Types</option>
          <option value="shipper">Shippers</option>
          <option value="consignee">Consignees</option>
          <option value="both">Both</option>
        </select>
      </div>

      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Company</th>
                <th>Type</th>
                <th>Contact</th>
                <th>Address</th>
                <th>Loads</th>
                <th>Revenue Shipped</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customers-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Customer Modal -->
  <div id="customer-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="customer-modal-title">New Customer</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body"><form id="customer-form"></form></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-dismiss>Cancel</button>
        <button class="btn btn-primary" onclick="document.getElementById('customer-form').requestSubmit()">Save</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
