<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loads – FreightFlow TMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button id="hamburger" class="hamburger">&#9776;</button>
        <h1>Loads</h1>
      </div>
      <div class="topbar-actions">
        <button id="btn-new-load" class="btn btn-primary">+ New Load</button>
      </div>
    </div>

    <div class="content">
      <div class="filter-bar">
        <input id="load-search" class="search-box" type="search" placeholder="Search loads, routes, commodities…">
        <select id="load-status-filter" class="filter-select">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="dispatched">Dispatched</option>
          <option value="in-transit">In Transit</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Load #</th>
                <th>Route</th>
                <th>Shipper / Consignee</th>
                <th>Pickup</th>
                <th>Status</th>
                <th>Carrier</th>
                <th>Rate</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="loads-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Load Modal -->
  <div id="load-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="load-modal-title">New Load</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="load-form"></form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-dismiss>Cancel</button>
        <button class="btn btn-primary" onclick="document.getElementById('load-form').requestSubmit()">Save Load</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/loads.js"></script>
</body>
</html>
